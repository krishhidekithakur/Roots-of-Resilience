<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can You Climate-Proof a Garden? — Roots of Resilience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;0,900;1,500;1,600&family=Karla:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#122428; --ink-2:#0C1A1D; --void:#070D0E; --reef:#1C3F44; --reef-light:#2E5D63;
  --reef-hair:rgba(231,217,188,0.14);
  --sand:#E7D9BC; --sand-dim:rgba(231,217,188,0.68); --sand-faint:rgba(231,217,188,0.38);
  --paper:#F4ECDA;
  --cassava:#CC9245; --taro:#93679C; --sweetpotato:#C9603F; --rain:#6FB9BE; --good:#8FAE7B;
  --font-display:'Fraunces', serif; --font-body:'Karla', sans-serif; --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0; height:100%;}
body{background:var(--ink); color:var(--sand); font-family:var(--font-body); font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden;}
h1,h2,h3,blockquote{font-family:var(--font-display); margin:0; font-weight:600;}
p{margin:0 0 1em;}
em{color:var(--cassava); font-style:italic;}
button, a.nav-btn{font-family:inherit; cursor:pointer;}
::selection{background:var(--sweetpotato); color:var(--paper);}
button:focus-visible, a:focus-visible, input:focus-visible{outline:2px solid var(--rain); outline-offset:3px;}
code{font-family:var(--font-mono); background:var(--reef); padding:1px 6px; border-radius:4px; font-size:.9em;}
a{color:var(--rain);}
.fine{font-size:13px; color:var(--sand-faint); font-style:italic;}
img{max-width:100%; display:block;}

/* ---------- ATMOSPHERE ---------- */
.ambient-bg{position:fixed; inset:0; z-index:0; pointer-events:none; background:var(--ink); transition:background 1.4s ease;}
.mood-void{background:var(--void);}
.mood-dawn{background:radial-gradient(ellipse 1100px 700px at 50% 8%, rgba(111,185,190,.11), transparent 60%), radial-gradient(ellipse 800px 500px at 12% 96%, rgba(204,146,69,.08), transparent 60%), var(--ink);}
.mood-clear{background:radial-gradient(ellipse 1000px 640px at 60% 5%, rgba(111,185,190,.13), transparent 58%), radial-gradient(ellipse 700px 500px at 90% 90%, rgba(143,174,123,.05), transparent 60%), var(--ink);}
.mood-tense{background:radial-gradient(ellipse 900px 600px at 50% 0%, rgba(201,96,63,.09), transparent 55%), radial-gradient(ellipse 700px 500px at 85% 100%, rgba(28,63,68,.5), transparent 60%), var(--ink-2);}
.mood-storm{background:radial-gradient(ellipse 950px 650px at 50% -5%, rgba(201,96,63,.16), transparent 55%), radial-gradient(ellipse 700px 500px at 10% 100%, rgba(28,63,68,.6), transparent 55%), var(--ink-2);}
.mood-overcast{background:radial-gradient(ellipse 1000px 600px at 50% 10%, rgba(231,217,188,.05), transparent 60%), radial-gradient(ellipse 700px 500px at 80% 90%, rgba(111,185,190,.05), transparent 60%), var(--ink);}
.mood-clarity{background:radial-gradient(ellipse 1050px 650px at 40% 5%, rgba(111,185,190,.12), transparent 58%), radial-gradient(ellipse 750px 550px at 90% 95%, rgba(143,174,123,.08), transparent 60%), var(--ink);}
.mood-archipelago{background:radial-gradient(ellipse 900px 600px at 20% 10%, rgba(111,185,190,.10), transparent 55%), radial-gradient(ellipse 800px 550px at 85% 20%, rgba(204,146,69,.07), transparent 55%), radial-gradient(ellipse 700px 500px at 60% 95%, rgba(147,103,156,.07), transparent 55%), var(--ink);}
.mood-golden{background:radial-gradient(ellipse 1100px 700px at 50% 0%, rgba(204,146,69,.14), transparent 60%), radial-gradient(ellipse 800px 500px at 15% 100%, rgba(201,96,63,.08), transparent 60%), var(--ink);}
.mood-sunset{background:radial-gradient(ellipse 1200px 750px at 50% 100%, rgba(201,96,63,.16), transparent 62%), radial-gradient(ellipse 900px 600px at 20% 0%, rgba(204,146,69,.10), transparent 60%), var(--ink);}

.grain{position:fixed; inset:0; z-index:2; pointer-events:none; opacity:.05; mix-blend-mode:overlay;}
.wave-horizon{position:fixed; left:0; right:0; bottom:0; height:120px; z-index:1; pointer-events:none; opacity:.35;}
.wave-horizon svg{width:200%; height:100%; animation:waveDrift 34s linear infinite;}
@keyframes waveDrift{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
.wave-horizon.hidden-wave{display:none;}
@media (prefers-reduced-motion:reduce){ .wave-horizon svg{animation:none;} }

.hud{position:fixed; top:0; left:0; right:0; z-index:20; display:flex; justify-content:space-between; align-items:center; padding:16px 32px; background:linear-gradient(var(--ink) 55%, transparent);}
.hud.hidden{display:none;}
.hud-route{display:flex; gap:5px; align-items:center;}
.hud-route .dot{width:6px; height:6px; border-radius:50%; background:var(--reef-light); transition:background .3s;}
.hud-route .dot.done{background:var(--rain);}
.restart-link{font-family:var(--font-mono); font-size:12px; color:var(--sand-faint); background:none; border:none; text-decoration:underline; text-underline-offset:3px;}
.back-link{font-family:var(--font-mono); font-size:12px; color:var(--sand-dim); background:none; border:none; text-decoration:none; display:flex; align-items:center; gap:6px; padding:6px 10px; margin-right:14px; border-radius:100px; transition:background .18s;}
.back-link:hover{background:var(--reef);}
.hud-left{display:flex; align-items:center;}

#stage{position:relative; z-index:3; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:120px 32px 80px;}
.scene{max-width:760px; width:100%; animation:fadein .6s ease both;}
.scene.wide{max-width:960px;}
.scene.narrow{max-width:600px;}
@keyframes fadein{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){ .scene{animation:none;} }

.eyebrow{font-family:var(--font-mono); font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--rain); margin-bottom:18px; display:block;}
.kicker{font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--cassava); margin-bottom:16px; display:block;}
h1.big{font-size:clamp(38px,6vw,68px); color:var(--paper); line-height:1.06; font-weight:900;}
.scene h2{font-size:clamp(27px,3.8vw,42px); color:var(--paper); line-height:1.15; margin-bottom:18px;}
.lede{color:var(--sand-dim); font-size:18px; max-width:680px;}
.center{text-align:center; margin-left:auto; margin-right:auto;}

.nav-btn{display:inline-flex; align-items:center; gap:8px; border-radius:100px; padding:16px 30px; font-size:16px; border:1px solid var(--reef-light); background:var(--reef); color:var(--sand); text-decoration:none; transition:all .18s;}
.nav-btn.primary{background:var(--paper); color:var(--ink); border-color:var(--paper); font-weight:700;}
.nav-btn.primary:hover{background:var(--rain); border-color:var(--rain); transform:translateY(-1px);}
.nav-btn.ghost:hover{border-color:var(--rain); color:var(--paper);}
.nav-btn.stark{background:transparent; border-color:var(--sand-faint); color:var(--sand-dim);}
.nav-btn.stark:hover{border-color:var(--paper); color:var(--paper);}

/* ---------- OPENING (Vanuatu, cold open) ---------- */
.dateline{font-family:var(--font-mono); font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--sand-faint); margin-bottom:32px;}
.opening-scene{margin:-40px -20px 36px; border-radius:0; overflow:hidden;}
.opening-scene svg{width:100%; height:auto; display:block;}
.opening-quote{font-family:var(--font-display); font-style:italic; font-weight:500; font-size:clamp(24px,4vw,36px); color:var(--paper); line-height:1.35; margin-bottom:14px;}
.opening-attr{font-family:var(--font-mono); font-size:13px; color:var(--rain); margin-bottom:44px;}
.opening-body{color:var(--sand-dim); font-size:17px; line-height:1.8; max-width:560px; margin:0 auto 20px;}
.opening-caveat{font-size:13.5px; color:var(--sand-faint); max-width:560px; margin:24px auto 0; border-top:1px solid var(--reef-hair); padding-top:18px;}

/* ---------- CALL TO ACTION ---------- */
.fund-cards{display:flex; flex-direction:column; gap:16px; margin:26px 0;}
.fund-card{background:var(--reef); border-radius:18px; padding:24px 28px; display:flex; gap:22px; align-items:flex-start;}
.fund-card .amount{font-family:var(--font-display); font-size:clamp(28px,4vw,36px); font-weight:800; color:var(--good); flex-shrink:0; min-width:130px;}
.fund-card .body h4{font-family:var(--font-display); font-size:16.5px; color:var(--paper); font-weight:600; margin-bottom:8px;}
.fund-card .body p{font-size:14.5px; color:var(--sand-dim); margin-bottom:6px;}
.fund-card .body .src{font-family:var(--font-mono); font-size:11px; color:var(--sand-faint);}
.gap-panel{border:1px dashed var(--reef-light); border-radius:18px; padding:24px 28px; margin:20px 0;}
.gap-panel .label{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--sweetpotato); margin-bottom:10px;}
.gap-panel p{font-size:14.5px; color:var(--sand-dim); margin:0;}
.action-climax{font-family:var(--font-display); font-size:clamp(26px,4vw,38px); color:var(--paper); font-weight:700; text-align:center; margin:40px 0 12px; line-height:1.25;}
.action-sub{text-align:center; color:var(--sand-dim); font-size:16px; max-width:520px; margin:0 auto 30px;}

/* ---------- GARDEN PLOT ---------- */
.garden-wrap{display:flex; flex-direction:column; align-items:center; margin:30px 0;}
.garden-grid{display:grid; grid-template-columns:repeat(10,1fr); gap:2.5px; width:min(320px,80vw); aspect-ratio:1;}
.garden-cell{border-radius:2px; transition:background .5s ease, opacity .5s ease;}
.garden-legend{display:flex; gap:20px; margin-top:16px; font-family:var(--font-mono); font-size:12px; color:var(--sand-dim); flex-wrap:wrap; justify-content:center;}
.garden-legend .sw{display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:6px; vertical-align:-1px;}

.slider-group{margin-bottom:22px; max-width:420px; margin-left:auto; margin-right:auto;}
.slider-label{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:14px; margin-bottom:9px;}
.slider-label .name{display:flex; align-items:center; gap:9px;}
.slider-label svg{width:20px; height:20px;}
.slider-label .pct{font-weight:800; font-size:16px;}
input[type="range"]{width:100%; height:6px;}
input[type="range"].s-cassava{accent-color:var(--cassava);}
input[type="range"].s-taro{accent-color:var(--taro);}
input[type="range"].s-sp{accent-color:var(--sweetpotato);}

.big-stat{font-family:var(--font-display); font-weight:900; font-size:clamp(56px,12vw,120px); color:var(--paper); line-height:1; margin:14px 0;}
.big-stat.bad{color:var(--sweetpotato);}
.big-stat.good{color:var(--good);}
.stat-sub{font-family:var(--font-mono); font-size:14px; color:var(--rain); letter-spacing:.02em;}

.reveal-panel{background:var(--reef); border-radius:20px; padding:32px clamp(20px,4vw,44px); margin:26px 0;}
.reveal-row{display:flex; justify-content:space-between; align-items:baseline; padding:12px 0; border-bottom:1px solid var(--reef-hair); font-family:var(--font-mono); font-size:14px;}
.reveal-row:last-child{border-bottom:none;}
.reveal-row .v{font-size:20px; font-weight:700;}
.reveal-row .v.neg{color:var(--sweetpotato);} .reveal-row .v.pos{color:var(--good);}

.mechanism-steps{display:flex; flex-direction:column; gap:0; margin:24px 0; align-items:center;}
.mechanism-step{background:var(--reef); border-radius:14px; padding:16px 22px; font-family:var(--font-mono); font-size:14.5px; color:var(--paper); text-align:center; max-width:440px;}
.mechanism-arrow{color:var(--rain); font-size:20px; margin:2px 0;}
.warming-image{border-radius:16px; overflow:hidden; margin:28px 0; border:1px solid var(--reef-light);}

.tile-grid{display:grid; grid-template-columns:repeat(10,1fr); gap:6px; margin:30px 0;}
.tile{aspect-ratio:1; border-radius:5px; position:relative;}
.tile.g{background:var(--good);} .tile.b{background:var(--sweetpotato);}
.tile:hover .tile-tip{display:block;}
.tile-tip{display:none; position:absolute; bottom:110%; left:50%; transform:translateX(-50%); background:var(--paper); color:var(--ink); font-family:var(--font-mono); font-size:10px; padding:5px 8px; border-radius:6px; white-space:nowrap; z-index:5;}
.tile-legend{display:flex; gap:24px; flex-wrap:wrap; margin-top:14px; font-family:var(--font-mono); font-size:12px; color:var(--sand-dim);}
.tile-legend .sw{display:inline-block; width:13px; height:13px; border-radius:3px; margin-right:7px; vertical-align:-2px;}

.crop-bars{display:flex; flex-direction:column; gap:14px; margin-top:10px;}
.crop-bar-row{display:grid; grid-template-columns:130px 1fr 76px; align-items:center; gap:16px;}
.crop-bar-name{font-family:var(--font-display); font-size:16px; color:var(--paper); font-weight:600; display:flex; align-items:center; gap:9px;}
.crop-bar-name svg{width:20px; height:20px;}
.crop-bar-track{background:var(--reef); border-radius:100px; height:14px; overflow:hidden;}
.crop-bar-fill{height:100%; border-radius:100px;}
.crop-bar-val{font-family:var(--font-mono); font-size:12.5px; text-align:right;}
.dual-bars{display:grid; grid-template-columns:1fr 1fr; gap:36px; margin-top:20px;}
@media (max-width:680px){ .dual-bars{grid-template-columns:1fr;} }
.dual-bars h4{font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--sand-faint); margin-bottom:14px;}

.strategy-panel{background:var(--reef); border-radius:20px; padding:30px clamp(18px,4vw,40px); margin-top:20px;}
.strategy-labels{display:grid; grid-template-columns:190px 1fr 62px 78px 78px; gap:10px; font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--sand-faint); padding-bottom:10px; border-bottom:1px solid var(--reef-light);}
.strategy-row{display:grid; grid-template-columns:190px 1fr 62px 78px 78px; align-items:center; gap:10px; padding:15px 0; border-bottom:1px solid var(--reef-hair);}
.strategy-row.highlight{background:rgba(143,174,123,.08); margin:0 -18px; padding:15px 18px; border-radius:12px;}
.strategy-row:last-child{border-bottom:none;}
.strategy-name{font-family:var(--font-display); font-size:15.5px; color:var(--paper); font-weight:600; display:flex; align-items:center; gap:8px;}
.strategy-name .icons{display:flex; gap:-6px;}
.strategy-name svg{width:26px; height:26px; flex-shrink:0;}
.strategy-name .icons svg:not(:first-child){margin-left:-10px;}
.strategy-track{position:relative; height:24px;}
.strategy-zero{position:absolute; right:0; top:0; bottom:0; width:1px; background:var(--sand-faint);}
.strategy-bar{position:absolute; top:7px; height:10px; border-radius:5px; background:var(--sweetpotato); right:0;}
.strategy-worst{font-family:var(--font-mono); font-size:14px; text-align:right; font-weight:700; color:var(--sweetpotato);}
.strategy-severe{font-family:var(--font-mono); font-size:12.5px; text-align:right; color:var(--sand-dim);}
.strategy-mean{font-family:var(--font-mono); font-size:12.5px; text-align:right; color:var(--sand-dim);}

.country-cards{display:flex; flex-direction:column; gap:14px; margin-top:22px;}
.country-card{background:var(--reef); border-radius:16px; padding:22px 26px; display:flex; gap:18px; align-items:flex-start;}
.country-card .glyph{flex-shrink:0; width:44px; height:44px;}
.country-card .body{flex:1;}
.country-card .name{font-family:var(--font-display); font-size:17px; color:var(--paper); font-weight:600; margin-bottom:8px;}
.country-card .desc{font-size:15px; color:var(--sand-dim);}
.country-card .tag{display:inline-block; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; padding:4px 11px; border-radius:100px; margin-top:10px;}
.tag.rising{background:rgba(143,174,123,.16); color:var(--good);}
.tag.falling{background:rgba(201,96,63,.16); color:var(--sweetpotato);}
.tag.stable{background:rgba(231,217,188,.1); color:var(--sand-faint);}

.map-wrap{margin:28px 0;}
.map-svg{width:100%; height:auto; border-radius:20px; background:#0E2226;}
.map-dot{cursor:pointer;}
.map-dot circle.ring{fill:none; stroke:var(--rain); stroke-width:1.5; opacity:0; transition:opacity .2s, r .2s;}
.map-dot circle.core{fill:var(--rain); stroke:var(--ink); stroke-width:2; transition:fill .2s, r .2s;}
.map-dot:hover circle.core, .map-dot.active circle.core{fill:var(--paper); r:9;}
.map-dot:hover circle.ring, .map-dot.active circle.ring{opacity:.5; r:16;}
.map-dot text{fill:var(--sand-dim); font-family:var(--font-mono); font-size:11px; pointer-events:none; transition:fill .2s;}
.map-dot:hover text, .map-dot.active text{fill:var(--paper); font-weight:600;}
.map-hint{font-family:var(--font-mono); font-size:12px; color:var(--sand-faint); text-align:center; margin-top:10px;}
.map-detail{background:var(--reef); border-radius:18px; padding:26px 28px; margin-top:18px; min-height:150px; display:flex; gap:18px; align-items:flex-start;}
.map-detail .glyph{flex-shrink:0; width:44px; height:44px; color:var(--rain);}
.map-detail .name{font-family:var(--font-display); font-size:19px; color:var(--paper); font-weight:600; margin-bottom:8px;}
.map-detail .desc{font-size:15px; color:var(--sand-dim);}
.map-detail .tag{display:inline-block; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; padding:4px 11px; border-radius:100px; margin-top:10px;}

.weave-box{display:flex; justify-content:center; margin:36px 0;}
.weave-box svg{width:100%; max-width:420px; height:auto;}
.weave-strand{fill:none; stroke-width:5; stroke-linecap:round;}

.knowledge-cards{display:flex; flex-direction:column; gap:18px; margin-top:10px;}
.k-card{background:var(--reef); border-radius:18px; padding:26px 28px;}
.k-card.centerpiece{border:1px solid var(--rain); background:linear-gradient(180deg, rgba(111,185,190,.08), var(--reef));}
.k-card .place{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--rain); margin-bottom:10px;}
.k-card h3{font-family:var(--font-display); font-size:19px; color:var(--paper); font-weight:600; margin-bottom:10px;}
.k-card p{color:var(--sand-dim); font-size:15px; margin-bottom:8px;}
.k-card .src{font-family:var(--font-mono); font-size:11px; color:var(--sand-faint);}
.k-card .src a{color:var(--rain);}

.ending-line{font-family:var(--font-display); font-size:clamp(24px,3.6vw,36px); color:var(--paper); font-weight:500; margin:0 auto 8px; max-width:700px;}
.ending-line.italic{font-style:italic; color:var(--sand-dim); font-size:clamp(18px,2.4vw,24px);}
blockquote{font-size:clamp(20px,2.6vw,28px); color:var(--paper); font-style:italic; font-weight:500; max-width:700px; margin:36px auto; line-height:1.4;}

footer{margin-top:80px; border-top:1px solid var(--reef-hair); padding:40px 0 60px; max-width:960px; margin-left:auto; margin-right:auto;}
footer h4{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--sand-faint); margin-bottom:12px;}
footer p{font-size:13px; color:var(--sand-dim); line-height:1.7;}
details{margin-top:16px;}
summary{font-family:var(--font-mono); font-size:12.5px; color:var(--rain); cursor:pointer; padding:8px 0;}
.methodology-table{width:100%; border-collapse:collapse; margin-top:14px; font-family:var(--font-mono); font-size:12px;}
.methodology-table th{text-align:left; padding:8px 10px; color:var(--sand-faint); border-bottom:1px solid var(--reef-light);}
.methodology-table td{padding:8px 10px; border-bottom:1px solid var(--reef-hair); color:var(--sand-dim);}
.opt-table{width:100%; border-collapse:collapse; margin-top:14px; font-family:var(--font-mono); font-size:12.5px;}
.opt-table th{text-align:left; padding:8px 10px; color:var(--sand-faint); text-transform:uppercase; font-size:10px; border-bottom:1px solid var(--reef-light);}
.opt-table td{padding:9px 10px; border-bottom:1px solid var(--reef-hair); color:var(--sand-dim);}
.opt-table .strat-name{color:var(--paper); font-weight:600;}
.confound-list{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0;}
.confound-list span{font-family:var(--font-mono); font-size:11px; color:var(--sand-faint); background:var(--ink-2); padding:5px 10px; border-radius:100px;}
.credit{font-family:var(--font-mono); font-size:12px; color:var(--sand-faint); margin-top:24px;}
.bib{font-size:13px; color:var(--sand-dim); line-height:1.8; margin-top:10px;}
.bib li{margin-bottom:6px;}

@media (max-width:640px){
  .tile-grid{grid-template-columns:repeat(6,1fr);}
  .strategy-labels, .strategy-row{grid-template-columns:130px 1fr 45px 60px 60px; gap:6px;}
  .strategy-name svg{width:20px; height:20px;}
  .strategy-name .icons svg:not(:first-child){margin-left:-8px;}

/* ============================================================
   PHYSICAL HARVEST MATH
   ============================================================ */
function hectareOutcome(ev, w){
  const Hstar = w.c*ev.eyC + w.t*ev.eyT + w.s*ev.eySp;
  const H = w.c*ev.eyC*(1+ev.cassava/100) + w.t*ev.eyT*(1+ev.taro/100) + w.s*ev.eySp*(1+ev.sp/100);
  return { pct: 100*(H/Hstar - 1), kgPerHa: (Hstar-H)*1000 };
}
function strategyStats(w){
  const outcomes = STRESS_EVENTS.map(ev=>hectareOutcome(ev,w).pct);
  const worst = Math.min(...outcomes);
  const mean = outcomes.reduce((a,b)=>a+b,0)/outcomes.length;
  const severe = outcomes.filter(o=>o<=-10).length;
  return {worst, mean, severe};
}

let state = { screen:'opening' };
let history = [];
let garden = { cassava:33, taro:33, sp:34 };
let backtestResult = null;

function go(screen){ history.push(state.screen); state = {screen}; render(); }
function goBack(){ if(history.length === 0) return; const prev = history.pop(); state = {screen:prev}; render(); }
function restartJourney(){ garden = {cassava:33, taro:33, sp:34}; backtestResult=null; history=[]; state={screen:'opening'}; render(); }

function normalizedGarden(){
  const sum = garden.cassava + garden.taro + garden.sp;
  if(sum === 0) return {c:1/3, t:1/3, s:1/3};
  return {c:garden.cassava/sum, t:garden.taro/sum, s:garden.sp/sum};
}
function runBacktest(){
  const w = normalizedGarden();
  const outcomes = STRESS_EVENTS.map(ev => Object.assign({}, ev, hectareOutcome(ev, w)));
  outcomes.sort((a,b)=>a.pct-b.pct);
  const worst = outcomes[0];
  const best = outcomes[outcomes.length-1];
  const mean = outcomes.reduce((s,o)=>s+o.pct,0)/outcomes.length;
  const severe = outcomes.filter(o=>o.pct<=-10).length;
  backtestResult = {w, outcomes, worst, best, mean, severe};
  return backtestResult;
}

/* ============================================================
   THE GARDEN PLOT — 100 cells, each = 1% of the hectare.
   Honest proportional area. Optional per-crop anomaly fades a
   crop's cells to show a real event's impact on the same plot.
   ============================================================ */
function renderGardenPlot(containerId, w, anomalies){
  const el = document.getElementById(containerId);
  if(!el) return;
  const nc = Math.round(w.c*100), nt = Math.round(w.t*100);
  const colorFor = i => i < nc ? 'cassava' : (i < nc+nt ? 'taro' : 'sp');
  const colorVar = {cassava:'var(--cassava)', taro:'var(--taro)', sp:'var(--sweetpotato)'};
  const cells = [];
  for(let i=0;i<100;i++){
    const crop = colorFor(i);
    let opacity = 1;
    if(anomalies){
      const a = anomalies[crop];
      opacity = Math.max(0.22, Math.min(1.15, 1 + a/110));
    }
    cells.push(`<div class="garden-cell" style="background:${colorVar[crop]}; opacity:${opacity.toFixed(2)}"></div>`);
  }
  el.innerHTML = cells.join('');
}

/* ============================================================
   RENDER DISPATCH
   ============================================================ */
function render(){
  const stage = document.getElementById('stage');
  const hud = document.getElementById('hud');
  const bg = document.getElementById('ambient-bg');
  const wave = document.getElementById('wave-horizon');
  hud.classList.toggle('hidden', NO_HUD.includes(state.screen) && history.length === 0);
  document.getElementById('back-btn').style.visibility = history.length === 0 ? 'hidden' : 'visible';
  wave.classList.toggle('hidden-wave', state.screen==='opening');
  bg.className = 'ambient-bg ' + (MOODS[state.screen] || 'mood-dawn');

  const idx = ROUTE_SCREENS.indexOf(state.screen);
  document.getElementById('hud-route').innerHTML = ROUTE_SCREENS.includes(state.screen) ? ROUTE_SCREENS.map((s,i)=>`<span class="dot ${i <= idx ? 'done':''}"></span>`).join('') : '';

  let html = '';
  switch(state.screen){
    case 'opening': html = renderOpening(); break;
    case 'climateIntro': html = renderClimateIntro(); break;
    case 'landing': html = renderLanding(); break;
    case 'firstTest': html = renderFirstTest(); break;
    case 'fullBacktest': html = renderFullBacktest(); break;
    case 'couldAnotherCrop': html = renderCouldAnotherCrop(); break;
    case 'the60': html = renderThe60(); break;
    case 'whyItWorks': html = renderWhyItWorks(); break;
    case 'evidence': html = renderEvidence(); break;
    case 'islands': html = renderIslands(); break;
    case 'culture': html = renderCulture(); break;
    case 'knowledge': html = renderKnowledge(); break;
    case 'action': html = renderAction(); break;
    case 'ending': html = renderEnding(); break;
    default: html = renderOpening();
  }
  stage.innerHTML = html;
  window.scrollTo(0,0);

  if(state.screen==='landing'){ renderGardenPlot('garden-plot', normalizedGarden()); }
  if(state.screen==='firstTest' && backtestResult){
    const t87 = STRESS_EVENTS.find(e=>e.country==='Tonga' && e.year===1987);
    renderGardenPlot('garden-plot-t87', backtestResult.w, {cassava:t87.cassava, taro:t87.taro, sp:t87.sp});
  }
  if(state.screen==='fullBacktest' && backtestResult){
    const worst = backtestResult.worst;
    renderGardenPlot('garden-plot-worst', backtestResult.w, {cassava:worst.cassava, taro:worst.taro, sp:worst.sp});
  }
  if(state.screen==='couldAnotherCrop'){ renderCropBars(); }
}

function renderLanding(){
  return `
    <div class="scene center">
      <span class="eyebrow">Roots of Resilience · Pacific Dataviz Challenge 2026</span>
      <h1 class="big">Can you climate-proof<br>a garden?</h1>
      <p class="lede center">You're planting one hectare. It needs to help feed your household through whatever the climate brings. Split it between cassava, taro and sweet potato however you like.</p>
      <p class="fine center">A hypothetical one-hectare garden, stress-tested using real national crop-yield histories — not an observed household garden.</p>
      <div class="slider-group" style="margin-top:26px;">
        <div class="slider-label"><span class="name"><svg viewBox="0 0 60 60" style="color:var(--cassava); width:20px; height:20px;"><use href="#icon-cassava"/></svg>Cassava</span><span class="pct" id="pct-cassava" style="color:var(--cassava)">33%</span></div>
        <input type="range" class="s-cassava" id="slider-cassava" min="0" max="100" value="33" oninput="onSlider()">
      </div>
      <div class="slider-group">
        <div class="slider-label"><span class="name"><svg viewBox="0 0 60 60" style="color:var(--taro); width:20px; height:20px;"><use href="#icon-taro"/></svg>Taro</span><span class="pct" id="pct-taro" style="color:var(--taro)">33%</span></div>
        <input type="range" class="s-taro" id="slider-taro" min="0" max="100" value="33" oninput="onSlider()">
      </div>
      <div class="slider-group">
        <div class="slider-label"><span class="name"><svg viewBox="0 0 60 60" style="color:var(--sweetpotato); width:20px; height:20px;"><use href="#icon-sweetpotato"/></svg>Sweet potato</span><span class="pct" id="pct-sp" style="color:var(--sweetpotato)">34%</span></div>
        <input type="range" class="s-sp" id="slider-sp" min="0" max="100" value="34" oninput="onSlider()">
      </div>
      <div class="garden-wrap">
        <div class="garden-grid" id="garden-plot"></div>
        <div class="garden-legend">
          <span><span class="sw" style="background:var(--cassava)"></span>Cassava</span>
          <span><span class="sw" style="background:var(--taro)"></span>Taro</span>
          <span><span class="sw" style="background:var(--sweetpotato)"></span>Sweet potato</span>
        </div>
      </div>
      <button class="nav-btn primary" onclick="beginTest()" style="font-size:18px; padding:18px 36px; margin-top:10px;">STRESS TEST MY GARDEN →</button>
    </div>`;
}
function onSlider(){
  garden.cassava = +document.getElementById('slider-cassava').value;
  garden.taro = +document.getElementById('slider-taro').value;
  garden.sp = +document.getElementById('slider-sp').value;
  const w = normalizedGarden();
  document.getElementById('pct-cassava').textContent = Math.round(w.c*100)+'%';
  document.getElementById('pct-taro').textContent = Math.round(w.t*100)+'%';
  document.getElementById('pct-sp').textContent = Math.round(w.s*100)+'%';
  renderGardenPlot('garden-plot', w);
}
function beginTest(){ runBacktest(); go('firstTest'); }

function renderFirstTest(){
  const w = backtestResult.w;
  const tonga87 = STRESS_EVENTS.find(e=>e.country==='Tonga' && e.year===1987);
  const out = hectareOutcome(tonga87, w);
  const dirClass = out.pct>=0?'pos':'neg';
  return `
    <div class="scene">
      <span class="kicker">Your garden, tested</span>
      <h2>Tonga, 1987</h2>
      <p class="lede">The driest year in Tonga's available rainfall-anomaly record. Here's what your exact mix would have actually harvested that season, based on real trend yields for each crop.</p>
      <div class="garden-wrap"><div class="garden-grid" id="garden-plot-t87"></div></div>
      <div class="reveal-panel">
        <div class="reveal-row"><span>Cassava (${Math.round(w.c*100)}% of your hectare)</span><span class="v">−11.0%</span></div>
        <div class="reveal-row"><span>Taro (${Math.round(w.t*100)}%)</span><span class="v">−5.3%</span></div>
        <div class="reveal-row"><span>Sweet potato (${Math.round(w.s*100)}%)</span><span class="v">+2.7%</span></div>
        <div class="reveal-row"><span><strong>Your garden's real harvest</strong></span><span class="v ${dirClass}">${out.pct>=0?'+':''}${out.pct.toFixed(1)}%</span></div>
      </div>
      <p class="lede">${out.pct > -8 ? "Not bad, all things considered." : "A real dent — but not a catastrophe."} But history isn't one drought.</p>
      <button class="nav-btn primary" onclick="go('fullBacktest')">Stress-test it against all 60 selected dry-year events →</button>
    </div>`;
}

function renderFullBacktest(){
  const r = backtestResult;
  const dirClass = r.worst.pct>=0?'good':'bad';
  return `
    <div class="scene center">
      <span class="kicker">The full test</span>
      <h2 style="text-align:left; max-width:600px; margin:0 auto 10px;">Your worst harvest across all 60 selected historical stress events</h2>
      <p class="lede center">All 60 complete historical dry-year events across Fiji, New Caledonia, Niue, Papua New Guinea, Solomon Islands and Tonga — real crop-yield anomalies, converted into a real per-hectare harvest.</p>
      <div class="garden-wrap"><div class="garden-grid" id="garden-plot-worst"></div></div>
      <div class="big-stat ${dirClass}">${r.worst.pct>=0?'+':''}${r.worst.pct.toFixed(1)}%</div>
      <div class="stat-sub">${r.worst.country}, ${r.worst.year} — your worst year (${Math.round(r.worst.kgPerHa)} kg/ha lost vs. trend)</div>
      <div class="reveal-panel" style="text-align:left; max-width:480px; margin:30px auto;">
        <div class="reveal-row"><span>Average outcome across 60 events</span><span class="v ${r.mean>=0?'pos':'neg'}">${r.mean>=0?'+':''}${r.mean.toFixed(1)}%</span></div>
        <div class="reveal-row"><span>Severe-loss years (worse than −10%)</span><span class="v">${r.severe} / 60</span></div>
        <div class="reveal-row"><span>Your best year</span><span class="v pos">+${r.best.pct.toFixed(1)}% (${r.best.country} ${r.best.year})</span></div>
      </div>
      <p class="lede center">Could a different mix have done better in your worst year? Let's find out.</p>
      <button class="nav-btn primary" onclick="go('couldAnotherCrop')">Could another crop have saved you? →</button>
    </div>`;
}

function renderCouldAnotherCrop(){
  return `
    <div class="scene">
      <span class="kicker">The search for a safe crop</span>
      <h2>Across all 60 real stress events, we tracked which crop performed best — and which performed worst</h2>
      <p class="lede">If one crop were simply "the safe choice," it would dominate the best list and stay off the worst list.</p>
      <div class="dual-bars">
        <div><h4>Best performer, by event</h4><div class="crop-bars" id="best-bars"></div></div>
        <div><h4>Worst performer, by event</h4><div class="crop-bars" id="worst-bars"></div></div>
      </div>
      <p class="lede" style="margin-top:24px;"><strong style="color:var(--paper);">The tell:</strong> sweet potato is the single most common winner (42% of events) — and tied for the single most common loser too (38%). Its outcomes are also the most spread out of the three (standard deviation ±33pp, against ±22–23pp for cassava and taro). Its ranking swings sharply from one dry year to the next — that's not "safe."</p>
      <button class="nav-btn primary" onclick="go('the60')">So what actually protects you? →</button>
    </div>`;
}

function renderThe60(){
  const tiles = STRESS_EVENTS.map(e=>{
    const allFail = e.cassava<0 && e.taro<0 && e.sp<0;
    return `<div class="tile ${allFail?'b':'g'}"><span class="tile-tip">${e.country} ${e.year}</span></div>`;
  }).join('');
  return `
    <div class="scene wide center">
      <span class="kicker">The number that matters most</span>
      <h2 style="max-width:660px; margin-left:auto; margin-right:auto;">How often did every root fall below trend together?</h2>
      <div class="big-stat bad">4 / 60</div>
      <div class="stat-sub">Fiji 2006 · New Caledonia 2014 · Tonga 1980 · Tonga 1981</div>
      <div class="tile-grid">${tiles}</div>
      <div class="tile-legend">
        <span><span class="sw" style="background:var(--good)"></span>At least one root at or above trend (56 events)</span>
        <span><span class="sw" style="background:var(--sweetpotato)"></span>All three below trend together (4 events)</span>
      </div>
      <p class="lede center" style="margin-top:26px;">In 56 of the 60 selected unusually dry country-years — 93.3% of the stress-test sample — at least one of the three national crop-yield series remained at or above its fitted trend. Plainly: even in an unusually dry year, the three crops rarely fell below trend together. That's the entire mechanism this project is built on.</p>
      <button class="nav-btn primary" onclick="go('whyItWorks')">Why does this happen? →</button>
    </div>`;
}

function renderWhyItWorks(){
  return `
    <div class="scene">

function renderEvidence(){
  const strategies = [
    {name:"Cassava only", w:{c:1,t:0,s:0}, icons:[["icon-cassava","var(--cassava)"]]},
    {name:"Taro only", w:{c:0,t:1,s:0}, icons:[["icon-taro","var(--taro)"]]},
    {name:"Sweet potato only", w:{c:0,t:0,s:1}, icons:[["icon-sweetpotato","var(--sweetpotato)"]]},
    {name:"Mixed garden (1/3 each)", w:{c:1/3,t:1/3,s:1/3}, highlight:true, icons:[["icon-cassava","var(--cassava)"],["icon-taro","var(--taro)"],["icon-sweetpotato","var(--sweetpotato)"]]},
  ];
  const maxAbs = 70;
  const rows = strategies.map(s=>{
    const stats = strategyStats(s.w);
    const widthPct = (Math.abs(stats.worst)/maxAbs*100).toFixed(1);
    const iconsHtml = `<span class="icons">${s.icons.map(([id,color])=>`<svg viewBox="0 0 60 60" style="color:${color}"><use href="#${id}"/></svg>`).join('')}</span>`;
    return `<div class="strategy-row ${s.highlight?'highlight':''}">
      <div class="strategy-name">${iconsHtml}${s.name}</div>
      <div class="strategy-track"><div class="strategy-zero"></div><div class="strategy-bar" style="width:${widthPct}%;"></div></div>
      <div class="strategy-worst">${stats.worst.toFixed(1)}%</div>
      <div class="strategy-severe">${stats.severe}/60 severe</div>
      <div class="strategy-mean">${stats.mean>=0?'+':''}${stats.mean.toFixed(1)}%</div>
    </div>`;
  }).join('');
  return `
    <div class="scene">
      <span class="kicker">64 years of crop records · 60 unusually dry country-year stress tests</span>
      <h2>What you just experienced, confirmed at full scale</h2>
      <p class="lede">Backtested against all 60 selected historical stress events, using fitted per-hectare trend yields rather than simple averages of crop percentage anomalies.</p>
      <div class="strategy-panel">
        <div class="strategy-labels"><div>Strategy</div><div>Worst year</div><div style="text-align:right;">Worst</div><div style="text-align:right;">Severe</div><div style="text-align:right;">Mean</div></div>
        ${rows}
      </div>
      <p class="lede" style="margin-top:22px;"><strong style="color:var(--paper);">The honest number:</strong> the equal-third garden's worst historical stress-test outcome was 36.7% below its fitted harvest benchmark — compared with 48.9% below trend for the best-performing monocrop on this worst-case measure (sweet potato). That's about a 25% smaller worst-case decline. The mixed garden also tied sweet potato for the fewest severe-loss years of any strategy (7 of 60 each) — while cutting the single worst possible year down substantially further. That's what insurance does: it doesn't stop bad years, it stops the worst one from being as bad as it could be.</p>
      <p class="lede"><strong style="color:var(--paper);">A sensitivity check:</strong> the single largest anomaly in this dataset is +188% (Fiji sweet potato, 1987) — real, but large enough to worry about. Capping every crop's yield anomaly at ±50% and rerunning the same hectare-weighted analysis leaves the equal-third garden's worst outcome at −31.7%, compared with −48.9% for the best monocrop on the same criterion — about a 35% smaller worst-case decline. The core downside-risk result does not depend on the largest crop-yield outliers.</p>
      <p class="lede"><strong style="color:var(--paper);">One more honest limitation:</strong> we also identified years that were both among the unusually dry and unusually hot observations for their country — a compound stress that can place additional pressure on crops. Six of the 60 stress events met both thresholds — too few for a separate strategy comparison with much confidence. We're reporting that gap directly rather than drawing a conclusion from too little data.</p>
      <button class="nav-btn primary" onclick="go('islands')">Does every island tell the same story? →</button>
    </div>`;
}

function showCountryDetail(name){
  document.getElementById('map-detail-name').textContent = name;
  document.getElementById('map-detail-desc').textContent = ISLAND_DESC[name];
  const div = DIVERSITY.find(d=>d.country===name);
  const tagEl = document.getElementById('map-detail-tag');
  if(div){
    const label = div.tag==='rising'?'More balanced':div.tag==='falling'?'More concentrated':'Stable';

    tagEl.className = 'tag ' + div.tag;
  }

  const active = Array.from(document.querySelectorAll('.map-dot')).find(el=>el.getAttribute('onclick').includes(`'${name}'`));

}

function renderCropBars(){
  const best = [
    {crop:"Sweet potato", icon:"icon-sweetpotato", n:25, pct:41.7, color:"var(--sweetpotato)"},

  ];
  const worst = [
    {crop:"Sweet potato", icon:"icon-sweetpotato", n:23, pct:38.3, color:"var(--sweetpotato)"},
    {crop:"Taro", icon:"icon-taro", n:23, pct:38.3, color:"var(--taro)"},
    {crop:"Cassava", icon:"icon-cassava", n:14, pct:23.3, color:"var(--cassava)"},
  ];
  const fill = (data, id) => {

        <div class="crop-bar-val">${d.n} (${d.pct}%)</div>
      </div>`).join('');
  };
  fill(best, 'best-bars');
  fill(worst, 'worst-bars');
}

render();
</script>
